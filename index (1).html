<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  <style>
      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: Arial, Helvetica, sans-serif;
      }
      
      html, body {
         width: 100%;
         height: 100%;
         background-color: antiquewhite;
      }
      
      .wrapper {
          display: flex;
          flex-direction: column;
          width: 100%;
          height: 100%;
          gap: 10px
      }
      
      header {
          background-color: skyblue;
          padding: 20px;
          display: flex;
          align-items: center;
          gap: 15px;
          font-weight: bold;
          border: 1px solid;
      }
      
      nav {
          background-color: orange;
          padding: 15px;
          text-align: left;
          font-weight: bold;
          border: 1px solid;
      }
      
      .main-content {
          display: flex;
          gap: 10px;
          flex: 1;
      }
      
      article {
          flex: 3;
          background-color:skyblue;
          padding: 15px;
          border: 1px solid skyblue;
          display: flex;
          flex-direction: column;
          gap: 10px;
      }
      
      section {
         background-color: orange;
          padding: 15px;
          border: 1px solid orange;
          flex: 1;
          display: flex;
          align-items: center;
      }
      
      aside {
          flex: 1;
          background-color: pink;
          padding: 15px;
          border: 1px solid green;
      } 
      
      footer {
          background-color: pink;
          padding: 15px;
          text-align: left;
          font-weight: bold;
          border: 1px solid;
      }
  </style>
</head>

                   <section>sec</section>
               </article>
               
               <aside>

               </aside>
            </div>
            
            <footer>
                 footer
            </footer>
</body>

</html>
